<html>
    <head>
        <title>Log in to Facebook</title>

        <style>
            form {
                width: 380px;
                margin-top: 150px;
                margin-left: auto;
                margin-right: auto;
                font-family: Arial, sans-serif;
            }
            h2 {
                font-size: 22px;
                margin-bottom: 25px;
                color: black;
            }

            #email {
                width: 100%;
                height: 48px;
                border: 1px solid #ccd0d5;
                border-radius: 12px;
                padding-left: 15px;
                font-size: 15px;
                margin-bottom: 12px;
                box-sizing: border-box;
            }

            #pass {
                width: 100%;
                height: 48px;
                border: 1px solid #ccd0d5;
                border-radius: 12px;
                padding-left: 15px;
                font-size: 15px;
                margin-bottom: 15px;
                box-sizing: border-box;
            }

            #login {
                width: 100%;
                height: 44px;
                background-color: #0866ff;
                color: white;
                border: none;
                border-radius: 22px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                margin-bottom: 20px;
            }

            #login:hover {
                background-color: #0055d4;
            }

            .forgot {
                text-align: center;
                margin-bottom: 40px;
            }

            .forgot a {
                color: black;
                text-decoration: none;
                font-size: 14px;
                font-weight: bold;
            }

            .forgot a:hover {
                text-decoration: underline;
            }

            #create {
                width: 100%;
                height: 44px;
                background-color: white;
                color: #0866ff;
                border: 1px solid #0866ff;
                border-radius: 22px;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
                margin-bottom: 30px;
            }

            #create:hover {
                background-color: #f0f2f5;
            }

        </style>
    </head>

    <body>
        <form>
            <h2>&#8249;&nbsp;&nbsp;Log in to Facebook</h2><br>

            <input type="text" id="email" placeholder="Email address or mobile number" required>
            <br>

            <input type="password" id="pass" placeholder="Password" required>
            <br>

            <button type="submit" id="login">Log in</button>

            <div class="forgot">
                <a href="#">Forgot password?</a>
            </div>

            <button type="button" id="create">Create new account</button>
        </form>
    </body>
</html>
